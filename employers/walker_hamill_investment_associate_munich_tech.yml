employer_name: "Walker Hamill"
ats_family: "generic_form"
application_url: "https://www.walkerhamill.com/job/dm53152-investment-associate/"
job_title: "Investment Associate"
job_description_url: "https://www.walkerhamill.com/job/dm53152-investment-associate/"
job_description_text: |
  Walker Hamill describes this as an Investment Associate role with a pan-European technology investor based in Munich. The associate would work with senior team members on research and evaluation of investment opportunities, deal structuring and negotiation, deal execution, and portfolio monitoring and management. The page says technology sector experience is advantageous and business proficiency in German is required.

llm_mode: "off"
start_button_texts:
  - "Apply for job"
  - "Apply"

field_mappings:
  - labels: ["Full name"]
    profile_path: "personal.full_name"
  - labels: ["Email address"]
    profile_path: "personal.email"

free_text_fields:
  - label_match:
      - "Message"
    type: "recruiter_message"
    generation:
      enabled: true
      max_words: 220
      insert_into_form: true

review_gate:
  stop_texts:
    - "Submit"
    - "Send"
  submit_texts:
    - "Submit"
    - "Send"
  require_manual_review: true
