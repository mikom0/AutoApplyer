employer_name: "Walker Hamill"
ats_family: "generic_form"
application_url: "https://www.walkerhamill.com/job/eh52942-investment-associate/"
job_title: "Investment Associate - Dutch/French Speaking"
job_description_url: "https://www.walkerhamill.com/job/eh52942-investment-associate/"
job_description_text: |
  Walker Hamill describes this as a London Investment Associate role with a large-cap European private equity fund. The role covers origination, execution, portfolio management, and exit. The page says candidates should have experience from investment banking M&A, strategy consulting, or private equity, and fluency in Dutch and/or French is required.

llm_mode: "off"
start_button_texts:
  - "Apply for job"
  - "Apply"

field_mappings:
  - labels: ["Full name"]
    profile_path: "personal.full_name"
  - labels: ["Email address"]
    profile_path: "personal.email"

free_text_fields:
  - label_match:
      - "Message"
    type: "recruiter_message"
    generation:
      enabled: true
      max_words: 220
      insert_into_form: true

review_gate:
  stop_texts:
    - "Submit"
    - "Send"
  submit_texts:
    - "Submit"
    - "Send"
  require_manual_review: true
